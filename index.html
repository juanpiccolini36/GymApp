<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background:#14171A; }
  body {
    color:#E8E6E1; font-family:'Inter',sans-serif;
    padding: 0 1rem calc(3rem + env(safe-area-inset-bottom));
    max-width:720px; margin:0 auto;
  }
  .sticky-top {
    position: sticky;
    top: 0;
    z-index: 40;
    background: #14171A;
    padding-top: calc(1rem + env(safe-area-inset-top));
    padding-bottom: .5rem;
    box-shadow: 0 8px 12px -6px rgba(0,0,0,.45);
  }
  .table-body { border-left:1px solid #2A2E33; border-right:1px solid #2A2E33; }
  .table-edge-top { border-top-left-radius:8px; border-top-right-radius:8px; overflow:hidden; }
  .table-edge-bottom { border-bottom-left-radius:8px; border-bottom-right-radius:8px; border-bottom:1px solid #2A2E33; }
  .header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #2A2E33;padding-bottom:.9rem;margin-bottom:.9rem;}
  .header-right{display:flex;align-items:flex-start;gap:.6rem;}
  .menu-wrap{position:relative;}
  .menu-btn{background:#1B1E22;border:1px solid #2E3237;color:#ABB1B8;width:2rem;height:2rem;border-radius:4px;font-size:1.1rem;line-height:1;cursor:pointer;}
  .menu-dropdown{display:none;position:absolute;right:0;top:2.4rem;background:#1B1E22;border:1px solid #2A2E33;border-radius:6px;min-width:180px;z-index:30;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.4);}
  .menu-dropdown.open{display:block;}
  .menu-item{display:block;width:100%;text-align:left;padding:.6rem .8rem;background:transparent;border:none;color:#E8E6E1;font-family:'IBM Plex Mono',monospace;font-size:.74rem;cursor:pointer;}
  .menu-item:hover{background:#22262B;}
  .menu-item-danger{color:#D68A8A;border-top:1px solid #2A2E33;}
  .menu-item-danger:hover{background:#2A1414;}
  .edit-banner{background:#12202A;border:1px solid #2A4A5E;color:#9FC6DE;padding:.55rem .8rem;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:.72rem;line-height:1.5;margin-bottom:.9rem;}
  .row-edit{background:#161A1E;}
  .row-edited{background:#1E1A12;}
  .edit-input{width:100%;background:#14171A;border:1px solid #3A3F45;color:#E8E6E1;font-family:'Inter',sans-serif;font-size:.76rem;padding:.3rem .4rem;border-radius:4px;}
  .edit-input:focus{outline:none;border-color:#E8A33D;}
  .edit-input-series{font-family:'IBM Plex Mono',monospace;font-size:.7rem;}
  .reset-ex-btn{width:1.8rem;height:1.8rem;border-radius:4px;border:1px solid #3A2E12;background:#14171A;color:#E8A33D;cursor:pointer;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:.9rem;}
  .edited-mark{color:#E8A33D;font-size:.7rem;}
  .toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%) translateY(20px);background:#173B2E;border:1px solid #4FA88C;color:#E8E6E1;padding:.6rem 1rem;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:.72rem;opacity:0;transition:opacity .25s, transform .25s;z-index:100;max-width:88%;text-align:center;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast-error{background:#3A1414;border-color:#D64545;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:#8A9099;margin-bottom:.15rem;}
  .title{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:1.5rem;color:#E8A33D;margin:0;}
  .macro-stat{text-align:right;}
  .macro-num{font-family:'IBM Plex Mono',monospace;font-size:1.5rem;font-weight:600;color:#4FA88C;line-height:1;}
  .macro-label{font-size:.6rem;color:#8A9099;text-transform:uppercase;letter-spacing:.06em;margin-top:.2rem;}
  .tabs{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.3rem;-webkit-overflow-scrolling:touch;}
  .tab{flex:none;padding:.45rem .9rem;border:1px solid #2E3237;border-radius:4px;background:#1B1E22;color:#ABB1B8;font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:.74rem;letter-spacing:.03em;cursor:pointer;}
  .tab.active{background:#E8A33D;color:#14171A;border-color:#E8A33D;}
  .phase-tabs{margin-bottom:.4rem;}
  .fase-rango{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:#8A9099;margin-bottom:.8rem;}
  .day-tabs{margin-bottom:.6rem;}
  .week-row{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.8rem;}
  .week-chip{padding:.3rem .65rem;border-radius:999px;border:1px solid #2E3237;background:#1B1E22;color:#ABB1B8;font-family:'IBM Plex Mono',monospace;font-size:.7rem;cursor:pointer;}
  .week-chip.active{background:#5B8DBE;border-color:#5B8DBE;color:#0E1113;font-weight:600;}
  .week-chip.deload{border-color:#D64545;color:#E88A8A;}
  .week-chip.deload.active{background:#D64545;color:#14171A;}
  .deload-banner{background:#2E1414;border:1px solid #D64545;color:#F2A5A5;padding:.55rem .8rem;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:.76rem;margin-bottom:.9rem;}
  .gauges-strip{display:flex;justify-content:space-around;background:#1B1E22;border:1px solid #2A2E33;border-radius:8px;padding:.6rem .4rem .3rem;margin-bottom:1rem;}
  .gauge-wrap{text-align:center;}
  .gauge-label{font-size:.62rem;color:#8A9099;text-transform:uppercase;letter-spacing:.04em;margin-top:-.2rem;}
  .row{display:grid;grid-template-columns:1.3rem 3.6rem 1fr 3.4rem 3.6rem 2.8rem 2.1rem;gap:.4rem;align-items:center;padding:.55rem .4rem;border-bottom:1px solid #22262B;font-size:.8rem;}
  .row:last-child{border-bottom:none;}
  .row-head{background:#1B1E22;color:#8A9099;font-family:'IBM Plex Mono',monospace;font-size:.6rem;text-transform:uppercase;letter-spacing:.05em;}
  .row-done{background:#14201C;}
  .col-n{color:#6B7178;font-family:'IBM Plex Mono',monospace;text-align:center;}
  .col-series{font-family:'IBM Plex Mono',monospace;color:#ABB1B8;font-size:.7rem;}
  .col-ex{line-height:1.25;}
  .badge{font-family:'IBM Plex Mono',monospace;font-size:.56rem;padding:.15rem .32rem;border-radius:3px;text-transform:uppercase;white-space:nowrap;display:inline-block;}
  .badge-ancla{background:#3A2E12;color:#E8A33D;border:1px solid #6B5220;}
  .badge-fuerza{background:#10202C;color:#5B8DBE;border:1px solid #274B66;}
  .badge-abdominales{background:#2C1D10;color:#C1734D;border:1px solid #5A3A22;}
  .badge-cardio{background:#2C130B;color:#D9622B;border:1px solid #5C2A14;}
  .peso-input{width:100%;background:#14171A;border:1px solid #2E3237;color:#E8E6E1;font-family:'IBM Plex Mono',monospace;font-size:.74rem;padding:.3rem .2rem;border-radius:4px;text-align:center;}
  .peso-input:focus{outline:none;border-color:#5B8DBE;}
  .obs-input{width:100%;background:#14171A;border:1px solid #2E3237;color:#ABB1B8;font-family:'Inter',sans-serif;font-size:.68rem;padding:.3rem .25rem;border-radius:4px;}
  .obs-input:focus{outline:none;border-color:#E8A33D;color:#E8E6E1;}
  .obs-input::placeholder{color:#4A4F55;}
  .check-btn{width:1.8rem;height:1.8rem;border-radius:4px;border:1px solid #2E3237;background:#14171A;color:#4FA88C;font-weight:700;cursor:pointer;margin:0 auto;display:flex;align-items:center;justify-content:center;}
  .check-btn.done{background:#173B2E;border-color:#4FA88C;}
  .footer{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;font-family:'IBM Plex Mono',monospace;font-size:.68rem;flex-wrap:wrap;gap:.5rem;}
  .save-indicator{color:#8A9099;}
  .backup-actions{display:flex;gap:.5rem;flex-wrap:wrap;}
  .btn-ghost{background:transparent;border:1px solid #2E3237;color:#ABB1B8;padding:.35rem .7rem;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:.66rem;cursor:pointer;}
  .btn-ghost:hover{background:#1B1E22;}
  .btn-danger{border-color:#3A2020;color:#D68A8A;}
  .btn-danger:hover{background:#2A1414;}
  .install-hint{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:#6B7178;background:#1B1E22;border:1px solid #2A2E33;border-radius:6px;padding:.6rem .7rem;margin-top:1rem;line-height:1.5;}
  .install-hint b{color:#ABB1B8;}
  .edit-scope-row{display:flex;align-items:center;flex-wrap:wrap;gap:.35rem;margin-top:.5rem;}
  .week-override-banner{background:#12202A;border:1px solid #2A4A5E;color:#9FC6DE;padding:.5rem .75rem;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:.7rem;margin-bottom:.9rem;}
  @media (max-width:480px){
    .row{grid-template-columns:1.1rem 3rem 1fr 2.9rem 3.1rem 2.4rem 1.9rem;gap:.3rem;font-size:.7rem;padding:.5rem .32rem;}
    .title{font-size:1.25rem;}
  }
  .program-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem;}
  .program-select{flex:1;background:#1B1E22;border:1px solid #2E3237;color:#E8E6E1;font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:.72rem;letter-spacing:.03em;padding:.4rem .5rem;border-radius:4px;}
  .btn-sm{font-size:.62rem;padding:.3rem .55rem;}

  .builder{padding-top:calc(1rem + env(safe-area-inset-top));}
  .builder-topbar{position:sticky;top:0;z-index:40;background:#14171A;display:flex;align-items:center;gap:.5rem;padding-bottom:.8rem;margin-bottom:1rem;border-bottom:1px solid #2A2E33;}
  .builder-name{flex:1;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.03em;font-size:.9rem;color:#E8A33D;border-color:#3A2E12;}
  .btn-save{background:#E8A33D;color:#14171A;border:none;font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:.72rem;letter-spacing:.03em;font-weight:600;padding:.5rem .9rem;border-radius:4px;cursor:pointer;}
  .builder-fase{background:#1B1E22;border:1px solid #2A2E33;border-radius:8px;padding:.8rem;margin-bottom:1rem;}
  .builder-fase-head{display:flex;gap:.5rem;align-items:center;margin-bottom:.5rem;}
  .builder-fase-head .edit-input{flex:1;}
  .builder-rango{margin-bottom:.6rem;font-size:.72rem;color:#ABB1B8;}
  .builder-semanas-row{display:flex;align-items:center;gap:.4rem;font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:#8A9099;margin-bottom:.5rem;}
  .week-num-input{width:3.4rem;background:#14171A;border:1px solid #2E3237;color:#E8E6E1;font-family:'IBM Plex Mono',monospace;font-size:.74rem;padding:.25rem .3rem;border-radius:4px;text-align:center;}
  .builder-deload-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;margin-bottom:.8rem;}
  .deload-label{font-family:'IBM Plex Mono',monospace;font-size:.66rem;color:#8A9099;margin-right:.2rem;}
  .builder-dia{background:#14171A;border:1px solid #22262B;border-radius:6px;padding:.6rem;margin-bottom:.6rem;}
  .builder-dia-head{display:flex;gap:.5rem;align-items:center;margin-bottom:.5rem;}
  .builder-dia-head .edit-input{flex:1;}
  .builder-ex-table{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.5rem;}
  .builder-ex-row{display:grid;grid-template-columns:5.2rem 1fr 4.4rem 1.8rem;gap:.35rem;align-items:center;}
  .ex-cat-select{background:#1B1E22;border:1px solid #2E3237;color:#ABB1B8;font-family:'IBM Plex Mono',monospace;font-size:.62rem;padding:.3rem .2rem;border-radius:4px;}
  .btn-add-fase{width:100%;background:transparent;border:1px dashed #3A3F45;color:#8A9099;font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:.75rem;letter-spacing:.03em;padding:.7rem;border-radius:6px;cursor:pointer;margin-bottom:1rem;}
  @media (max-width:480px){
    .builder-ex-row{grid-template-columns:4.4rem 1fr 3.6rem 1.6rem;}
  }

  /* ===== ESCRITORIO / PANTALLAS ANCHAS ===== */
  @media (min-width:860px){
    html { background:#0B0D0F; }
    body {
      max-width:900px;
      padding: 0 2.2rem calc(3rem + env(safe-area-inset-bottom));
    }
    .sticky-top { padding-top: 1.6rem; }
    .eyebrow{ font-size:.74rem; }
    .title{ font-size:2rem; }
    .macro-num{ font-size:2rem; }
    .macro-label{ font-size:.66rem; }
    .tab{ font-size:.82rem; padding:.55rem 1.15rem; }
    .week-chip{ font-size:.76rem; padding:.4rem .8rem; }
    .fase-rango{ font-size:.78rem; }
    .program-select{ font-size:.8rem; padding:.5rem .6rem; }
    .gauges-strip{ padding:1.1rem .8rem .7rem; }
    .gauge-wrap svg{ width:150px; height:90px; }
    .gauge-label{ font-size:.7rem; }
    .row{
      grid-template-columns: 1.8rem 5.2rem 1fr 4.6rem 8rem 4.2rem 2.8rem;
      gap:.7rem; padding:.75rem .7rem; font-size:.92rem;
    }
    .row-head{ font-size:.66rem; }
    .badge{ font-size:.64rem; padding:.2rem .45rem; }
    .col-series{ font-size:.8rem; }
    .peso-input,.obs-input{ font-size:.85rem; padding:.4rem .5rem; }
    .check-btn{ width:2.1rem; height:2.1rem; }
    .edit-banner,.week-override-banner,.deload-banner{ font-size:.8rem; padding:.7rem .9rem; }
    .install-hint,.footer{ font-size:.76rem; }
    .btn-ghost{ font-size:.72rem; padding:.4rem .8rem; }

    /* estados hover, solo para dispositivos con mouse real */
    .tab:not(.active):hover{ background:#22262B; border-color:#3A3F45; }
    .week-chip:not(.active):hover{ background:#22262B; border-color:#3A3F45; }
    .check-btn:hover{ border-color:#4FA88C; }
    .menu-item:hover{ background:#22262B; }
    .program-select:hover{ border-color:#3A3F45; }
  }
  @media (min-width:860px) and (min-height:1px){
    .builder{ max-width:900px; }
    .builder-ex-row{ grid-template-columns:6rem 1fr 5.2rem 2rem; }
    .builder-name{ font-size:1.05rem; }
  }
</style>
</head>

<script>

function loadPrograms() {
  try {
    const raw = localStorage.getItem(PROGRAMS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  const seeded = { ciclo1: { nombre: "Ciclo 1 — Recomposición (20 sem)", fases: SEED_FASES } };
  try { localStorage.setItem(PROGRAMS_KEY, JSON.stringify(seeded)); } catch (e) {}
  return seeded;
}
let savePgTimer = null;
function savePrograms() {
  clearTimeout(savePgTimer);
  savePgTimer = setTimeout(() => {
    try { localStorage.setItem(PROGRAMS_KEY, JSON.stringify(state.programs)); } catch (e) {}
  }, 350);
}
function loadProgreso() {
  try {
    const raw = localStorage.getItem(PROGRESO_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
let saveProgTimer = null;
function scheduleSaveProgreso() {
  state.saveState = "saving";
  renderFooterOnly();
  clearTimeout(saveProgTimer);
  saveProgTimer = setTimeout(() => {
    try {
      localStorage.setItem(PROGRESO_KEY, JSON.stringify(state.progreso));
      state.saveState = "saved";
    } catch (e) { state.saveState = "error"; }
    renderFooterOnly();
  }, 350);
}

// ---------------------------------------------------------------------------
// HELPERS DE PROGRAMA ACTIVO
// ---------------------------------------------------------------------------
function activeProgram() { return state.programs[state.programKey]; }
function faseKeys() { return Object.keys(activeProgram().fases); }
function currentFase() { return activeProgram().fases[state.phaseKey]; }
function dayKeysOf(fase) { return Object.keys(fase.dias); }

function ensureValidSelection() {
  const prog = activeProgram();
  const fks = Object.keys(prog.fases);
  if (!fks.includes(state.phaseKey)) state.phaseKey = fks[0];
  const fase = prog.fases[state.phaseKey];
  const dks = Object.keys(fase.dias);
  if (!dks.includes(state.day)) state.day = dks[0];
  if (!fase.semanas.includes(state.week)) state.week = fase.semanas[0];
}

function getExercise(day, week, idx) {
  const fase = currentFase();
  const ov = fase.overridesSemana && fase.overridesSemana[week] && fase.overridesSemana[week][day];
  const arr = (ov && ov[idx]) ? ov[idx] : fase.dias[day][idx];
  return { cat: arr[0], nombre: arr[1], series: arr[2] };
}
function hasWeekOverride(day, week) {
  const fase = currentFase();
  return !!(fase.overridesSemana && fase.overridesSemana[week] && fase.overridesSemana[week][day]);
}
function updateExercise(idx, patch) {
  const fase = currentFase();
  const { day, week } = state;
  if (state.editScope === "semana") {
    fase.overridesSemana = fase.overridesSemana || {};
    fase.overridesSemana[week] = fase.overridesSemana[week] || {};
    if (!fase.overridesSemana[week][day]) {
      // clonamos la lista efectiva actual para esta semana puntual
      fase.overridesSemana[week][day] = fase.dias[day].map(arr => arr.slice());
    }
    const arr = fase.overridesSemana[week][day][idx];
    if (patch.nombre !== undefined) arr[1] = patch.nombre;
    if (patch.series !== undefined) arr[2] = patch.series;
  } else {
    const arr = fase.dias[day][idx];
    if (patch.nombre !== undefined) arr[1] = patch.nombre;
    if (patch.series !== undefined) arr[2] = patch.series;
  }
  savePrograms();
}
function removeWeekOverride() {
  const fase = currentFase();
  const { day, week } = state;
  if (fase.overridesSemana && fase.overridesSemana[week]) {
    delete fase.overridesSemana[week][day];
    if (Object.keys(fase.overridesSemana[week]).length === 0) delete fase.overridesSemana[week];
  }
  savePrograms();
  render();
}

function getSlot(day, week, idx) {
  const p = state.progreso;
  return (p[state.programKey] && p[state.programKey][state.phaseKey] &&
          p[state.programKey][state.phaseKey][day] && p[state.programKey][state.phaseKey][day][week] &&
          p[state.programKey][state.phaseKey][day][week][idx]) || { peso:"", obs:"", done:false };
}
function updateSlot(idx, patch) {
  const { programKey, phaseKey, day, week } = state;
  const p = state.progreso;
  p[programKey] = p[programKey] || {};
  p[programKey][phaseKey] = p[programKey][phaseKey] || {};
  p[programKey][phaseKey][day] = p[programKey][phaseKey][day] || {};
  p[programKey][phaseKey][day][week] = p[programKey][phaseKey][day][week] || {};
  const current = p[programKey][phaseKey][day][week][idx] || { peso:"", obs:"", done:false };
  p[programKey][phaseKey][day][week][idx] = Object.assign({}, current, patch);
  scheduleSaveProgreso();
}

// ---------------------------------------------------------------------------
// CALCULOS DE CUMPLIMIENTO
// ---------------------------------------------------------------------------
function calcDayPct(day, week) {
  const fase = currentFase();
  const ejercicios = fase.dias[day];
  let done = 0;
  ejercicios.forEach((_, idx) => { if (getSlot(day, week, idx).done) done++; });
  return Math.round((done / ejercicios.length) * 100);
}
function calcFasePct(faseKey) {
  const fase = activeProgram().fases[faseKey];
  let done = 0, total = 0;
  dayKeysOf(fase).forEach(d => {
    fase.semanas.forEach(s => {
      fase.dias[d].forEach((_, idx) => {
        total++;
        const slot = (state.progreso[state.programKey] && state.progreso[state.programKey][faseKey] &&
                      state.progreso[state.programKey][faseKey][d] && state.progreso[state.programKey][faseKey][d][s] &&
                      state.progreso[state.programKey][faseKey][d][s][idx]) || { done:false };
        if (slot.done) done++;
      });
    });
  });
  return total ? Math.round((done/total)*100) : 0;
}
function calcMacroPct() {
  let done = 0, total = 0;
  Object.keys(activeProgram().fases).forEach(fk => {
    const fase = activeProgram().fases[fk];
    dayKeysOf(fase).forEach(d => {
      fase.semanas.forEach(s => {
        fase.dias[d].forEach((_, idx) => {
          total++;
          const slot = (state.progreso[state.programKey] && state.progreso[state.programKey][fk] &&
                        state.progreso[state.programKey][fk][d] && state.progreso[state.programKey][fk][d][s] &&
                        state.progreso[state.programKey][fk][d][s][idx]) || { done:false };
          if (slot.done) done++;
        });
      });
    });
  });
  return total ? Math.round((done/total)*100) : 0;
}

// ---------------------------------------------------------------------------
function gaugeSVG(percent, label) {
  const pct = Math.max(0, Math.min(100, percent));
  // Barrido correcto: 0% = izquierda (180°), 50% = arriba (270°/-90°), 100% = derecha (360°/0°)
  const angle = 180 + (pct/100)*180;
  const color = pct >= 80 ? "#4FA88C" : pct >= 40 ? "#E8A33D" : "#D64545";
  const rad = d => d * Math.PI / 180;
  const cx=60, cy=54, r=44;
  const arcStart = { x: cx + r*Math.cos(rad(180)), y: cy + r*Math.sin(rad(180)) };
  const arcEnd   = { x: cx + r*Math.cos(rad(360)), y: cy + r*Math.sin(rad(360)) };
  const progEnd  = { x: cx + r*Math.cos(rad(angle)), y: cy + r*Math.sin(rad(angle)) };
  const needleLen = r - 12;
  const nx = cx + needleLen*Math.cos(rad(angle));
  const ny = cy + needleLen*Math.sin(rad(angle));
  const ticks = [0,25,50,75,100].map(t => {
    const a = 180 + (t/100)*180;
    return {
      x1: cx + (r-6)*Math.cos(rad(a)), y1: cy + (r-6)*Math.sin(rad(a)),
      x2: cx + r*Math.cos(rad(a)),     y2: cy + r*Math.sin(rad(a)),
    };
  });
  return `
    <div class="gauge-wrap">
      <svg width="120" height="72" viewBox="0 0 120 66">
        <path d="M ${arcStart.x} ${arcStart.y} A ${r} ${r} 0 0 1 ${arcEnd.x} ${arcEnd.y}" fill="none" stroke="#2A2E33" stroke-width="10" stroke-linecap="round"/>
        <path d="M ${arcStart.x} ${arcStart.y} A ${r} ${r} 0 0 1 ${progEnd.x} ${progEnd.y}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"/>
        ${ticks.map(t => `<line x1="${t.x1}" y1="${t.y1}" x2="${t.x2}" y2="${t.y2}" stroke="#5A5F66" stroke-width="2"/>`).join("")}
        <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="#E8E6E1" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="${cx}" cy="${cy}" r="4" fill="#E8E6E1"/>
        <text x="${cx}" y="${cy-16}" text-anchor="middle" font-family="IBM Plex Mono" font-size="15" font-weight="600" fill="${color}">${pct}%</text>
      </svg>
      <div class="gauge-label">${label}</div>
    </div>`;
}

function escapeAttr(str) {
  return String(str == null ? "" : str).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function weekRange(a, b) {
  const inicio = Number(a) || 1;
  const fin = Math.max(Number(b) || inicio, inicio);
  const out = [];
  for (let w = inicio; w <= fin; w++) out.push(w);
  return out;
}

function saveLabel() {

  if (state.saveState === "saved") return "Guardado en este dispositivo ✓";

function renderFooterOnly() {
  const el = document.getElementById("save-indicator");

}

// ---------------------------------------------------------------------------
// LISTENERS — VISTA TRACKER
// ---------------------------------------------------------------------------
function attachListeners() {
  document.querySelectorAll('[data-action="phase"]').forEach(el => {
    el.addEventListener("click", () => {
      state.phaseKey = el.dataset.value;
      const fase = currentFase();
      state.day = dayKeysOf(fase)[0];
      state.week = fase.semanas[0];
      state.editScope = "fase";
      render();
    });
  });
  document.querySelectorAll('[data-action="day"]').forEach(el => {
    el.addEventListener("click", () => { state.day = el.dataset.value; state.editScope = "fase"; render(); });
  });
  document.querySelectorAll('[data-action="week"]').forEach(el => {
    el.addEventListener("click", () => { state.week = Number(el.dataset.value); render(); });
  });
  document.querySelectorAll('[data-action="check"]').forEach(el => {
    el.addEventListener("click", () => {
      const idx = Number(el.dataset.idx);
      const cur = getSlot(state.day, state.week, idx);
      updateSlot(idx, { done: !cur.done });
      render();
    });
  });
  document.querySelectorAll('[data-action="peso"]').forEach(el => {
    el.addEventListener("input", () => {
      const idx = Number(el.dataset.idx);
      updateSlot(idx, { peso: el.value });
    });
  });
  document.querySelectorAll('[data-action="obs"]').forEach(el => {
    el.addEventListener("input", () => {
      const idx = Number(el.dataset.idx);
      updateSlot(idx, { obs: el.value });
    });
  });
  document.querySelectorAll('[data-action="edit-nombre"]').forEach(el => {
    el.addEventListener("input", () => updateExercise(Number(el.dataset.idx), { nombre: el.value }));
  });
  document.querySelectorAll('[data-action="edit-series"]').forEach(el => {
    el.addEventListener("input", () => updateExercise(Number(el.dataset.idx), { series: el.value }));
  });
  document.querySelectorAll('[data-action="edit-scope"]').forEach(el => {
    el.addEventListener("click", () => { state.editScope = el.dataset.value; render(); });
  });
  const removeOverrideBtn = document.querySelector('[data-action="remove-week-override"]');
  if (removeOverrideBtn) removeOverrideBtn.addEventListener("click", () => {
    if (!hasWeekOverride(state.day, state.week)) {
      showToast(`La Semana ${state.week} no tiene personalización propia todavía.`);
      return;
    }
    if (!window.confirm(`¿Quitar la personalización de la Semana ${state.week}? Vuelve a usar los ejercicios de toda la fase.`)) return;
    removeWeekOverride();
  });

  const menuBtn = document.querySelector('[data-action="menu-toggle"]');
  if (menuBtn) menuBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    state.menuOpen = !state.menuOpen;
    render();
  });
  const toggleEditBtn = document.querySelector('[data-action="toggle-edit"]');
  if (toggleEditBtn) toggleEditBtn.addEventListener("click", () => {
    state.editMode = !state.editMode;
    state.editScope = "fase";
    state.menuOpen = false;
    render();
  });
  const newCycleBtn = document.querySelector('[data-action="new-cycle"]');
  if (newCycleBtn) newCycleBtn.addEventListener("click", () => openBuilder(null));
  const editStructBtn = document.querySelector('[data-action="edit-structure"]');
  if (editStructBtn) editStructBtn.addEventListener("click", () => openBuilder(state.programKey));

  const programSelect = document.querySelector('[data-action="program-select"]');
  if (programSelect) programSelect.addEventListener("change", () => {
    state.programKey = programSelect.value;
    const prog = activeProgram();
    const fk = Object.keys(prog.fases)[0];
    state.phaseKey = fk;
    state.day = dayKeysOf(prog.fases[fk])[0];
    state.week = prog.fases[fk].semanas[0];
    render();
  });
  const programDelete = document.querySelector('[data-action="program-delete"]');
  if (programDelete) programDelete.addEventListener("click", () => {
    state.menuOpen = false;
    const keys = Object.keys(state.programs);
    if (keys.length <= 1) {
      render();
      showToast("No podés eliminar el único ciclo que tenés. Creá uno nuevo antes de borrar este.", true);
      return;
    }
    if (!window.confirm(`¿Eliminar el ciclo "${activeProgram().nombre}"? Se borra también su progreso guardado. Esta acción no se puede deshacer.`)) {
      render();
      return;
    }
    const delKey = state.programKey;
    delete state.programs[delKey];
    if (state.progreso[delKey]) delete state.progreso[delKey];
    state.programKey = Object.keys(state.programs)[0];
    savePrograms();
    scheduleSaveProgreso();
    render();
  });

  const exportBtn = document.querySelector('[data-action="export"]');
  if (exportBtn) exportBtn.addEventListener("click", exportBackup);
  const exportExcelBtn = document.querySelector('[data-action="export-excel"]');
  if (exportExcelBtn) exportExcelBtn.addEventListener("click", exportExcel);
  const shareBtn = document.querySelector('[data-action="share"]');
  if (shareBtn) shareBtn.addEventListener("click", shareBackup);
  const importBtn = document.querySelector('[data-action="import"]');
  const importInput = document.getElementById("import-input");
  if (importBtn) importBtn.addEventListener("click", () => importInput.click());
  if (importInput) importInput.addEventListener("change", importBackup);
  const resetBtn = document.querySelector('[data-action="reset"]');
  if (resetBtn) resetBtn.addEventListener("click", resetTodo);

  document.addEventListener("click", (e) => {
    if (state.menuOpen && !e.target.closest(".menu-wrap")) {
      state.menuOpen = false;
      render();
    }
  }, { once: true });
}

function openBuilder(existingKey) {
  if (existingKey) {
    const prog = state.programs[existingKey];
    const fasesArr = Object.keys(prog.fases).map(fk => {
      const f = prog.fases[fk];
      return {
        nombre: f.nombre,
        rango: f.rango,
        semanaInicio: f.semanas[0],
        semanaFin: f.semanas[f.semanas.length-1],
        deload: [...f.deload],
        dias: Object.keys(f.dias).map(dn => ({
          nombre: dn,
          ejercicios: f.dias[dn].map(arr => ({ cat: arr[0], nombre: arr[1], series: arr[2] })),
        })),
      };
    });
    state.builderDraft = { nombre: prog.nombre, fases: fasesArr };
    state.builderOriginalKey = existingKey;
  } else {
    state.builderDraft = { nombre: "Nuevo ciclo", fases: [] };
    state.builderOriginalKey = null;
  }
  state.view = "builder";
  state.menuOpen = false;
  render();
}

    });
  });

  document.querySelectorAll('[data-action="b-ex-add"]').forEach(el => {
    el.addEventListener("click", () => {
      const d = draft.fases[Number(el.dataset.fi)].dias[Number(el.dataset.di)];
      d.ejercicios.push({ cat: "Fuerza", nombre: "", series: "" });
      render();
    });
  });
  document.querySelectorAll('[data-action="b-ex-nombre"]').forEach(el => {
    el.addEventListener("input", () => {
      draft.fases[Number(el.dataset.fi)].dias[Number(el.dataset.di)].ejercicios[Number(el.dataset.ei)].nombre = el.value;
    });
  });
  document.querySelectorAll('[data-action="b-ex-series"]').forEach(el => {
    el.addEventListener("input", () => {
      draft.fases[Number(el.dataset.fi)].dias[Number(el.dataset.di)].ejercicios[Number(el.dataset.ei)].series = el.value;
    });
  });
  document.querySelectorAll('[data-action="b-ex-cat"]').forEach(el => {
    el.addEventListener("change", () => {
      draft.fases[Number(el.dataset.fi)].dias[Number(el.dataset.di)].ejercicios[Number(el.dataset.ei)].cat = el.value;
      render();
    });
  });
  document.querySelectorAll('[data-action="b-ex-del"]').forEach(el => {
    el.addEventListener("click", () => {
      draft.fases[Number(el.dataset.fi)].dias[Number(el.dataset.di)].ejercicios.splice(Number(el.dataset.ei), 1);
      render();
    });
  });
}

function commitBuilder() {
  const draft = state.builderDraft;
  if (!draft.nombre.trim()) { alert("Ponele un nombre al ciclo."); return; }
  if (draft.fases.length === 0) { alert("Agregá al menos una fase."); return; }
  for (const f of draft.fases) {
    if (f.dias.length === 0) { alert(`La fase "${f.nombre}" necesita al menos un día.`); return; }
    for (const d of f.dias) {
      if (d.ejercicios.length === 0) { alert(`El día "${d.nombre}" necesita al menos un ejercicio.`); return; }
      for (const e of d.ejercicios) {
        if (!e.nombre.trim()) { alert(`Hay un ejercicio sin nombre en "${d.nombre}".`); return; }
      }
    }
  }

  const faseObj = {};
  draft.fases.forEach((f, i) => {
    const key = "fase" + (i + 1);
    const semanas = weekRange(f.semanaInicio, f.semanaFin);
    const deload = (f.deload || []).filter(w => semanas.includes(w));
    const dias = {};
    f.dias.forEach((d, di) => {
      const nombreDia = (d.nombre && d.nombre.trim()) || ("Día " + (di + 1));
      dias[nombreDia] = d.ejercicios.map(e => [e.cat, e.nombre, e.series]);
    });
    faseObj[key] = { nombre: f.nombre || key, rango: f.rango || "", semanas, deload, dias };
  });

  const key = state.builderOriginalKey || ("ciclo-" + Date.now().toString(36));
  state.programs[key] = { nombre: draft.nombre, fases: faseObj };
  savePrograms();

  state.programKey = key;
  const firstFase = Object.keys(faseObj)[0];
  state.phaseKey = firstFase;
  state.day = Object.keys(faseObj[firstFase].dias)[0];
  state.week = faseObj[firstFase].semanas[0];
  state.view = "tracker";
  state.builderDraft = null;
  render();
}

// ---------------------------------------------------------------------------
// BACKUP: EXPORTAR / IMPORTAR / RESET
// ---------------------------------------------------------------------------
function getEffectiveExercise(prog, faseKey, fase, day, week, idx) {
  const ov = fase.overridesSemana && fase.overridesSemana[week] && fase.overridesSemana[week][day];
  const arr = (ov && ov[idx]) ? ov[idx] : fase.dias[day][idx];
  return arr;
}
function getSlotFor(pk, fk, day, week, idx) {
  const p = state.progreso;
  return (p[pk] && p[fk] && p[pk][fk] && p[pk][fk][day] && p[pk][fk][day][week] && p[pk][fk][day][week][idx]) || { peso:"", obs:"", done:false };
}
function exportExcel() {
  if (typeof XLSX === "undefined") {
    showToast("No se pudo cargar el motor de Excel — revisá tu conexión a internet e intentá de nuevo.", true);
    return;
  }
  try {
    const detalle = [];
    const resumen = [];
    Object.keys(state.programs).forEach(pk => {
      const prog = state.programs[pk];
      let cicloDone = 0, cicloTotal = 0;
      Object.keys(prog.fases).forEach(fk => {
        const fase = prog.fases[fk];
        let faseDone = 0, faseTotal = 0;
        Object.keys(fase.dias).forEach(day => {
          fase.semanas.forEach(week => {
            fase.dias[day].forEach((_, idx) => {
              const exArr = getEffectiveExercise(prog, fk, fase, day, week, idx);
              const slot = (state.progreso[pk] && state.progreso[pk][fk] && state.progreso[pk][fk][day] &&
                            state.progreso[pk][fk][day][week] && state.progreso[pk][fk][day][week][idx]) || { peso:"", obs:"", done:false };
              faseTotal++; cicloTotal++;
              if (slot.done) { faseDone++; cicloDone++; }
              detalle.push({
                "Ciclo": prog.nombre,
                "Fase": fase.nombre,
                "Día": day,
                "Semana": week,
                "Deload": fase.deload.includes(week) ? "Sí" : "",
                "N°": idx + 1,
                "Categoría": exArr[0],
                "Ejercicio": exArr[1],
                "Series": exArr[2],
                "Peso": slot.peso || "",
                "Observaciones": slot.obs || "",
                "Realizado": slot.done ? "Sí" : "No",
              });
            });
          });
        });
        resumen.push({
          "Ciclo": prog.nombre,
          "Fase": fase.nombre,
          "Ejercicios completados": faseDone,
          "Total ejercicios": faseTotal,
          "% Cumplimiento": faseTotal ? Math.round((faseDone/faseTotal)*100) + "%" : "0%",
        });
      });
      resumen.push({
        "Ciclo": prog.nombre,
        "Fase": "TOTAL DEL CICLO",
        "Ejercicios completados": cicloDone,
        "Total ejercicios": cicloTotal,
        "% Cumplimiento": cicloTotal ? Math.round((cicloDone/cicloTotal)*100) + "%" : "0%",
      });
    });

    const wb = XLSX.utils.book_new();
    const wsResumen = XLSX.utils.json_to_sheet(resumen);
    const wsDetalle = XLSX.utils.json_to_sheet(detalle);
    wsResumen["!cols"] = [{wch:28},{wch:22},{wch:20},{wch:16},{wch:16}];
    wsDetalle["!cols"] = [{wch:28},{wch:18},{wch:12},{wch:8},{wch:8},{wch:4},{wch:12},{wch:32},{wch:14},{wch:8},{wch:30},{wch:10}];
    XLSX.utils.book_append_sheet(wb, wsResumen, "Resumen");
    XLSX.utils.book_append_sheet(wb, wsDetalle, "Progreso detallado");
    XLSX.writeFile(wb, `plan5fases-respaldo-${new Date().toISOString().slice(0,10)}.xlsx`);
    showToast("Excel descargado — revisá tu carpeta Descargas.");
  } catch (e) {
    console.warn("Fallo exportExcel:", e);
    showToast("No se pudo generar el Excel.", true);
  }
}

function buildBackupPayload() {
  return {
    app: "plan5fases",
    version: 3,
    exportado: new Date().toISOString(),
    programs: state.programs,
    progreso: state.progreso,
  };
}
function backupFilename() {
  return `plan5fases-respaldo-${new Date().toISOString().slice(0,10)}.json`;
}
function showToast(msg, isError) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const el = document.createElement("div");
  el.className = "toast" + (isError ? " toast-error" : "");
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => { el.classList.remove("show"); setTimeout(() => el.remove(), 300); }, 4000);
}

// Descarga con estrategias en cascada: revocar la URL demasiado rapido, o
// disparar la descarga dentro de una PWA instalada en pantalla completa,
// son causas conocidas de que un <a download> falle en silencio en Android.
function triggerDownload(jsonStr, filename) {
  const blob = new Blob([jsonStr], { type: "application/json" });

  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    // revocar recien despues de un rato: revocar de inmediato puede cortar
    // la descarga en algunos navegadores/PWAs instaladas
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    showToast("Descarga iniciada — revisá tu carpeta Descargas.");
    return;
  } catch (e) {
    console.warn("Fallo descarga por anchor:", e);
  }

  try {
    const url = URL.createObjectURL(blob);
    window.open(url, "_blank");
    setTimeout(() => URL.revokeObjectURL(url), 8000);
    showToast("Se abrió el respaldo en una pestaña — guardalo desde ahí.");
    return;
  } catch (e) {
    console.warn("Fallo descarga por ventana nueva:", e);
  }

  showToast("No se pudo descargar automáticamente. Probá 'Compartir a Drive'.", true);
}

function exportBackup() {
  const payload = buildBackupPayload();
  triggerDownload(JSON.stringify(payload, null, 2), backupFilename());
}

function shareBackup() {
  const payload = buildBackupPayload();
  const jsonStr = JSON.stringify(payload, null, 2);
  const filename = backupFilename();
  try {
    const blob = new Blob([jsonStr], { type: "application/json" });
    const file = new File([blob], filename, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: "Respaldo Plan 5 Fases" })
        .then(() => showToast("Compartido."))
        .catch((err) => {
          if (err && err.name === "AbortError") return; // el usuario cerro el menu, no es un error
          triggerDownload(jsonStr, filename); // si el share falla, caemos a descarga directa igual
        });
      return;
    }
  } catch (e) {
    console.warn("Fallo share:", e);
  }
  // Sin soporte de Web Share: no dejamos al usuario en un callejon sin salida,
  // resolvemos con la descarga directa de una.
  triggerDownload(jsonStr, filename);
}
function importBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (data && data.programs && typeof data.programs === "object") {
        if (!window.confirm("Esto reemplaza TODOS tus ciclos y tu progreso en este dispositivo por los del archivo. ¿Continuar?")) return;
        state.programs = data.programs;
        state.progreso = data.progreso || {};
      } else if (data && data.progreso) {
        if (!window.confirm("Este es un respaldo antiguo (solo progreso, sin ciclos). Se reemplaza el progreso actual. ¿Continuar?")) return;
        state.progreso = data.progreso;
      } else {
        throw new Error("Formato inválido");
      }
      state.programKey = Object.keys(state.programs)[0];
      savePrograms();
      scheduleSaveProgreso();
      render();
    } catch (err) {
      alert("No se pudo leer el archivo de respaldo. Verificá que sea un JSON exportado desde esta misma página.");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
}
function resetTodo() {
  if (!window.confirm("¿Borrar el progreso guardado de este ciclo y dispositivo? Los ciclos (estructura) NO se borran, solo los checks y pesos. Esta acción no se puede deshacer.")) return;
  state.progreso[state.programKey] = {};
  scheduleSaveProgreso();
  render();
}
